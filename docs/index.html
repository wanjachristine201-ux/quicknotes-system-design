<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes Manager</h1>
        <p>A dynamic web client connected to RESTful backend services.</p>
    </header>

    <main>
        <section class="controls">
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </section>

        <section class="form-section">
            <h2>Create New Note</h2>
            <form id="note-form">
                <div>
                    <label for="title-input">Title (required, max 100 chars):</label><br>
                    <input type="text" id="title-input" required maxlength="100" placeholder="Note title...">
                </div>
                <div>
                    <label for="body-input">Body (optional):</label><br>
                    <textarea id="body-input" rows="4" placeholder="Write your note body..."></textarea>
                </div>
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes System Design Project</p>
    </footer>

</body>
</html>
